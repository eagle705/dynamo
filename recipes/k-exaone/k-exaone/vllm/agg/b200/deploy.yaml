#
# K-EXAONE-236B-A23B-FP8 vLLM aggregated serving on B200.
#
# Model: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
# HF card: https://huggingface.co/LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
#   vLLM upstream: --reasoning-parser deepseek_v3 --tool-call-parser hermes
#                  --gpu_memory_utilization 0.94
#   Dynamo parsers: --dyn-reasoning-parser deepseek_r1 --dyn-tool-call-parser hermes
#
# Shape: 1 replica x 8 GPUs, TP=8 + Expert Parallel. Fills a single 8-GPU node.
# Weights: served from the shared-model-cache PVC.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-236b-a23b-agg-fp8
spec:
  backendFramework: vllm
  pvcs:
    - name: shared-model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          workingDir: /workspace/examples/backends/vllm
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "1"
    VllmDecodeWorker:
      componentType: worker
      subComponentType: decode
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /models
      sharedMemory:
        size: 200Gi
      extraPodSpec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-B200
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          workingDir: /workspace/examples/backends/vllm
          # First launch loads weights over TP=8 ranks and captures CUDA graphs.
          # Allow ~90 min: periodSeconds * failureThreshold = 10 * 540 = 5400s.
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 540
          env:
            - name: SERVED_MODEL_NAME
              value: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
            - name: MODEL_PATH
              value: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
            - name: HF_HOME
              value: /models
            # Read weights from the PVC only; do not hit the HF Hub at startup.
            - name: HF_HUB_OFFLINE
              value: "1"
            # Give the engine room to finish first-launch init.
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "5400"
            # Stabilize TP/EP all-reduces and skip the IPC P2P probe.
            - name: VLLM_SKIP_P2P_CHECK
              value: "1"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model "${MODEL_PATH}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --trust-remote-code \
                --block-size 256 \
                --tensor-parallel-size 8 \
                --enable-expert-parallel \
                --gpu-memory-utilization 0.94 \
                --dyn-reasoning-parser deepseek_r1 \
                --dyn-tool-call-parser hermes \
                --max-num-seqs 256
      replicas: 1
      resources:
        limits:
          gpu: "8"
        requests:
          gpu: "8"
