#
# K-EXAONE-236B-A23B-FP8 SGLang disaggregated prefill/decode on H200 (InfiniBand).
#
# Model: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
# HF card: https://huggingface.co/LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
#   - SGLang upstream: --tp-size 4 --reasoning-parser qwen3
#   - Tool parser: hermes
#   - Default enable_thinking=True; set chat_template_kwargs.enable_thinking=false for latency.
#
# Topology: 2 nodes, single-node TP4 each
#   prefill: 1 node x 4 H200 GPUs = TP4
#   decode:  1 node x 4 H200 GPUs = TP4
#
# Prerequisites:
#   - Dynamo operator and dynamo-platform installed
#   - Model weights cached on shared-model-cache PVC
#   - hf-token-secret created in the target namespace
#   - InfiniBand RDMA available through the rdma/ib device plugin

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-h200-disagg-fp8-tp4tp4
spec:
  backendFramework: sglang
  envs:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token-secret
          key: HF_TOKEN
    - name: HF_HOME
      value: /models
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: GLOO_SOCKET_IFNAME
      value: eth0
    - name: NCCL_SOCKET_IFNAME
      value: eth0

  pvcs:
    - name: shared-model-cache
      create: false

  services:
    Frontend:
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /models
      extraPodSpec:
        mainContainer:
          command:
            - python3
          args:
            - -m
            - dynamo.frontend
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.1
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360

    decode:
      componentType: worker
      subComponentType: decode
      replicas: 1
      resources:
        limits:
          gpu: "4"
          custom:
            rdma/ib: "4"
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /models
      sharedMemory:
        size: 200Gi
      extraPodSpec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        mainContainer:
          command:
            - bash
            - -c
          args:
            - |
              set -Eeuo pipefail
              echo "PRESTART_GPU_GUARD_BEGIN role=decode ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              nvidia-smi -L
              visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
              if [ "${visible_count}" -ne 4 ]; then
                echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=decode visible_count=${visible_count} expected=4"
                exit 96
              fi
              ls -l /dev/infiniband || true
              echo "PRESTART_GPU_GUARD_PASS role=decode"
              ulimit -l unlimited && ulimit -n 1048576
              exec python3 -m dynamo.sglang \
                --model-path LGAI-EXAONE/K-EXAONE-236B-A23B-FP8 \
                --served-model-name LGAI-EXAONE/K-EXAONE-236B-A23B-FP8 \
                --trust-remote-code \
                --tp 4 \
                --attention-backend fa3 \
                --chunked-prefill-size 4096 \
                --disable-flashinfer-autotune \
                --dyn-tool-call-parser hermes \
                --dyn-reasoning-parser qwen3 \
                --mem-fraction-static 0.80 \
                --host 0.0.0.0 \
                --disaggregation-mode decode \
                --disaggregation-transfer-backend nixl \
                --disaggregation-bootstrap-port 30001 \
                --prefill-round-robin-balance \
                --watchdog-timeout 3600
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
              value: "0"
            - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
              value: "1"
            # UCX and NIXL use IB RDMA for KV transfer between pods.
            - name: UCX_TLS
              value: "rc_x,rc,cuda_copy,cuda_ipc"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: UCX_IB_ADDR_TYPE
              value: "eth"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: UCX_RC_TIMEOUT
              value: "600s"
            - name: UCX_KEEPALIVE_INTERVAL
              value: "300s"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
            - name: NCCL_STORE_TIMEOUT
              value: "7200"
            - name: NIXL_LOG_LEVEL
              value: INFO
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.1
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          workingDir: /workspace/

    prefill:
      componentType: worker
      subComponentType: prefill
      replicas: 1
      resources:
        limits:
          gpu: "4"
          custom:
            rdma/ib: "4"
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /models
      sharedMemory:
        size: 200Gi
      extraPodSpec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        mainContainer:
          command:
            - bash
            - -c
          args:
            - |
              set -Eeuo pipefail
              echo "PRESTART_GPU_GUARD_BEGIN role=prefill ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              nvidia-smi -L
              visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
              if [ "${visible_count}" -ne 4 ]; then
                echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=prefill visible_count=${visible_count} expected=4"
                exit 96
              fi
              ls -l /dev/infiniband || true
              echo "PRESTART_GPU_GUARD_PASS role=prefill"
              ulimit -l unlimited && ulimit -n 1048576
              exec python3 -m dynamo.sglang \
                --model-path LGAI-EXAONE/K-EXAONE-236B-A23B-FP8 \
                --served-model-name LGAI-EXAONE/K-EXAONE-236B-A23B-FP8 \
                --trust-remote-code \
                --tp 4 \
                --attention-backend fa3 \
                --chunked-prefill-size 4096 \
                --disable-flashinfer-autotune \
                --dyn-tool-call-parser hermes \
                --dyn-reasoning-parser qwen3 \
                --mem-fraction-static 0.80 \
                --host 0.0.0.0 \
                --disaggregation-mode prefill \
                --disaggregation-transfer-backend nixl \
                --disaggregation-bootstrap-port 30001 \
                --load-balance-method round_robin \
                --watchdog-timeout 3600
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
              value: "0"
            - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
              value: "1"
            # UCX and NIXL use IB RDMA for KV transfer between pods.
            - name: UCX_TLS
              value: "rc_x,rc,cuda_copy,cuda_ipc"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: UCX_IB_ADDR_TYPE
              value: "eth"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: UCX_RC_TIMEOUT
              value: "600s"
            - name: UCX_KEEPALIVE_INTERVAL
              value: "300s"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
            - name: NCCL_STORE_TIMEOUT
              value: "7200"
            - name: NIXL_LOG_LEVEL
              value: INFO
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.1
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          workingDir: /workspace/
