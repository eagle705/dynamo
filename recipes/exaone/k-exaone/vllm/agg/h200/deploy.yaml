#
# K-EXAONE-236B-A23B-FP8 vLLM aggregated serving on H200.
#
# Model: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
# HF card: https://huggingface.co/LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
#   vLLM upstream: --reasoning-parser deepseek_v3 --tool-call-parser hermes
#                  --gpu_memory_utilization 0.94
#   Dynamo parsers: --dyn-reasoning-parser deepseek_r1 --dyn-tool-call-parser hermes
#
# Topology: 1 node x 4 H200 GPUs = TP4 + Expert Parallel.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-h200-vllm-agg-fp8-tp4
spec:
  backendFramework: vllm
  env:
  - name: HF_HOME
    value: "/models"
  - name: HF_HUB_OFFLINE
    value: '1'
  - name: GLOO_SOCKET_IFNAME
    value: eth0
  - name: NCCL_SOCKET_IFNAME
    value: eth0
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          workingDir: "/workspace/examples/backends/vllm"
          startupProbe:
            httpGet:
              path: "/health"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/models"
  - name: decode
    type: decode
    replicas: 1
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          imagePullPolicy: Always
          workingDir: "/workspace/examples/backends/vllm"
          startupProbe:
            httpGet:
              path: "/health"
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 540
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          env:
          - name: SERVED_MODEL_NAME
            value: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
          - name: MODEL_PATH
            value: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '5400'
          - name: VLLM_SKIP_P2P_CHECK
            value: '1'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          command:
          - "/bin/sh"
          - "-c"
          args:
          - |
            ulimit -l unlimited && exec python3 -m dynamo.vllm \
              --model "${MODEL_PATH}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --trust-remote-code \
              --tensor-parallel-size 4 \
              --enable-expert-parallel \
              --gpu-memory-utilization 0.94 \
              --dyn-reasoning-parser deepseek_r1 \
              --dyn-tool-call-parser hermes \
              --block-size 256 \
              --stream-interval 30 \
              --max-num-seqs 256
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: '4'
            limits:
              nvidia.com/gpu: '4'
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/models"
