#
# K-EXAONE-236B-A23B-FP8 vLLM aggregated serving on H200 with KV-aware routing.
#
# Topology: 2 decode workers, each 1 node x 4 H200 GPUs = TP4.
# Total requested GPU: 8 H200 GPUs.
#
# Frontend: event-driven KV-aware routing. Workers publish KV cache events over
# ZMQ, and the frontend consumes them using the same 256-token block size.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-h200-vllm-agg-fp8-tp4x2-kv
spec:
  backendFramework: vllm
  env:
  - name: HF_HOME
    value: "/models"
  - name: HF_HUB_OFFLINE
    value: '1'
  - name: GLOO_SOCKET_IFNAME
    value: eth0
  - name: NCCL_SOCKET_IFNAME
    value: eth0
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          imagePullPolicy: Always
          workingDir: "/workspace/examples/backends/vllm"
          command:
          - "/bin/sh"
          - "-c"
          args:
          - >-
            python3 -m dynamo.frontend
            --router-kv-events
            --kv-cache-block-size 256
            --http-port 8000
          env:
          - name: DYN_ROUTER_MODE
            value: kv
          startupProbe:
            httpGet:
              path: "/health"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/models"
  - name: decode
    type: decode
    replicas: 2
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          imagePullPolicy: Always
          workingDir: "/workspace/examples/backends/vllm"
          startupProbe:
            httpGet:
              path: "/health"
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 540
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          env:
          - name: SERVED_MODEL_NAME
            value: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
          - name: MODEL_PATH
            value: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '5400'
          - name: VLLM_SKIP_P2P_CHECK
            value: '1'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          command:
          - "/bin/sh"
          - "-c"
          args:
          - |
            ulimit -l unlimited && exec python3 -m dynamo.vllm \
              --model "${MODEL_PATH}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --trust-remote-code \
              --tensor-parallel-size 4 \
              --enable-expert-parallel \
              --gpu-memory-utilization 0.94 \
              --dyn-reasoning-parser deepseek_r1 \
              --dyn-tool-call-parser hermes \
              --block-size 256 \
              --stream-interval 30 \
              --max-num-seqs 256 \
              --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: '4'
            limits:
              nvidia.com/gpu: '4'
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/models"
