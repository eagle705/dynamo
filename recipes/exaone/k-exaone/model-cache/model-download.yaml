apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: model-download
    spec:
      restartPolicy: Never
      containers:
        - name: model-download
          image: python:3.10-slim
          command: ["sh", "-c"]
          envFrom:
            - secretRef:
                name: hf-token-secret
          env:
            - name: MODEL_NAME
              value: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
            - name: HF_HOME
              value: /models
            # Uses up to 64 GB RAM for XET buffers; set "0" on low-memory nodes (8 GB cap): https://huggingface.co/docs/hub/en/xet/using-xet-storage#download-buffers
            # - name: HF_XET_HIGH_PERFORMANCE
            #   value: "1"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "0"
          args:
            - |
              set -eux
              # huggingface_hub 1.11.0 hf CLI imports click; recent typer no longer pulls it in
              pip install --no-cache-dir huggingface_hub==1.11.0 click
              hf download $MODEL_NAME
          resources:
            requests:
              cpu: "2"
              # memory: "64Gi"
              memory: "8Gi"
            limits:
              cpu: "8"
              # memory: "64Gi"
              memory: "16Gi"
          volumeMounts:
            - name: shared-model-cache
              mountPath: /models
      volumes:
      - name: shared-model-cache
        persistentVolumeClaim:
          claimName: shared-model-cache
