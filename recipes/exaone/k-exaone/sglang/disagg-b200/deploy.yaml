#
# K-EXAONE-236B-A23B-FP8 SGLang Disaggregated P/D on B200 (InfiniBand)
#
# Model: LGAI-EXAONE/K-EXAONE-236B-A23B-FP8 (236B total / 23B active MoE)
# HF card: https://huggingface.co/LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
#   - dtype: FP8 compressed-tensors (use the standard K-EXAONE MoE path)
#   - SGLang upstream: --tp-size N --reasoning-parser qwen3
#   - vLLM upstream: --tool-call-parser hermes --reasoning-parser deepseek_v3
#   - default enable_thinking=True; set chat_template_kwargs.enable_thinking=false for latency
#
# B200 additions vs HF minimal SGLang recipe:
#   --attention-backend trtllm_mha --page-size 32  (Blackwell MHA kernel)
#
# Topology: 2 nodes, single-node TP8 each
#   prefill: 1 node × 8 GPUs = TP8
#   decode:  1 node × 8 GPUs = TP8
#
# Prerequisites:
#   - dynamo-platform HelmRelease applied
#   - Model weights cached on shared-model-cache PVC
#   - hf-token-secret created: kubectl create secret generic hf-token-secret \
#       --from-literal=HF_TOKEN=<your-token> -n <namespace>
#
# RDMA: Disaggregated KV transfer requires InfiniBand RDMA for NIXL.
# See README.md for cluster-specific details.
#
# EAGLE disabled: crashes on long context (>18k) and tool calling on TP8
# due to insufficient GPU memory headroom (4.23 GB/GPU with vs 7.75 without)

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-236b-a23b-disagg-fp8
spec:
  backendFramework: sglang
  env:
  - name: HF_TOKEN
    valueFrom:
      secretKeyRef:
        name: hf-token-secret
        key: HF_TOKEN
  - name: HF_HOME
    value: "/models"
  - name: HF_HUB_OFFLINE
    value: '1'
  - name: GLOO_SOCKET_IFNAME
    value: eth0
  - name: NCCL_SOCKET_IFNAME
    value: eth0
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        containers:
        - name: main
          command:
          - python3
          args:
          - "-m"
          - dynamo.frontend
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.1
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: "/health"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/models"
  - name: decode
    type: decode
    replicas: 1
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-B200
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        containers:
        - name: main
          command:
          - bash
          - "-c"
          args:
          - ulimit -l unlimited && ulimit -n 1048576 && exec python3 -m dynamo.sglang
            --model-path LGAI-EXAONE/K-EXAONE-236B-A23B-FP8 --served-model-name LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
            --trust-remote-code --tp 8 --attention-backend trtllm_mha --page-size
            32 --chunked-prefill-size 4096 --disable-flashinfer-autotune --dyn-tool-call-parser
            hermes --dyn-reasoning-parser qwen3 --mem-fraction-static 0.82 --host
            0.0.0.0 --disaggregation-mode decode --disaggregation-transfer-backend
            nixl --disaggregation-bootstrap-port 30001 --prefill-round-robin-balance
            --watchdog-timeout 3600
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
            value: '0'
          - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
            value: '1'
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          - name: NCCL_IB_DISABLE
            value: '0'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_STORE_TIMEOUT
            value: '7200'
          - name: NIXL_LOG_LEVEL
            value: INFO
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.1
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: "/live"
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          workingDir: "/workspace/"
          resources:
            limits:
              nvidia.com/gpu: '8'
              rdma/ib: '8'
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/models"
  - name: prefill
    type: prefill
    replicas: 1
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-B200
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        containers:
        - name: main
          command:
          - bash
          - "-c"
          args:
          - ulimit -l unlimited && ulimit -n 1048576 && exec python3 -m dynamo.sglang
            --model-path LGAI-EXAONE/K-EXAONE-236B-A23B-FP8 --served-model-name LGAI-EXAONE/K-EXAONE-236B-A23B-FP8
            --trust-remote-code --tp 8 --attention-backend trtllm_mha --page-size
            32 --chunked-prefill-size 4096 --disable-flashinfer-autotune --dyn-tool-call-parser
            hermes --dyn-reasoning-parser qwen3 --mem-fraction-static 0.82 --host
            0.0.0.0 --disaggregation-mode prefill --disaggregation-transfer-backend
            nixl --disaggregation-bootstrap-port 30001 --load-balance-method round_robin
            --watchdog-timeout 3600
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
            value: '0'
          - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
            value: '1'
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          - name: NCCL_IB_DISABLE
            value: '0'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_STORE_TIMEOUT
            value: '7200'
          - name: NIXL_LOG_LEVEL
            value: INFO
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.1
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: "/live"
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          workingDir: "/workspace/"
          resources:
            limits:
              nvidia.com/gpu: '8'
              rdma/ib: '8'
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/models"
